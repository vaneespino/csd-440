
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Registration Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #A09EE8;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
        }
        .form-container {
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 480px;
        }
        h2 {
            margin-top: 0;
            color: #333333;
            text-align: center;
        }
        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            color: #555555;
        }
        input[type="text"],
        input[type="email"],
        input[type="number"],
        input[type="date"],
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #cccccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
        }
        .radio-group label {
            display: inline-block;
            font-weight: normal;
            margin-right: 15px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #007BFF;
            border: none;
            border-radius: 4px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

<div class="form-container">
    <h2>Member Registration</h2>
    <form action="VanessaResponse.php" method="POST" novalidate>
        
        <!-- Field 1: String / Text -->
        <div class="form-group">
            <label for="full_name">1. Full Name (Text):</label>
            <input type="text" id="full_name" name="full_name" placeholder="Jasmine Palms">
        </div>

        <!-- Field 2: Email -->
        <div class="form-group">
            <label for="email">2. Email Address (Email):</label>
            <input type="email" id="email" name="email" placeholder="jasmine.palms@example.com">
        </div>

        <!-- Field 3: Integer -->
        <div class="form-group">
            <label for="age">3. Age (Whole Number):</label>
            <input type="number" id="age" name="age" placeholder="28">
        </div>

        <!-- Field 4: Float / Decimal -->
        <div class="form-group">
            <label for="gpa">4. Current GPA (Decimal, 0.0 - 4.0):</label>
            <input type="number" step="0.01" id="gpa" name="gpa" placeholder="3.80">
        </div>

        <!-- Field 5: Date -->
        <div class="form-group">
            <label for="start_date">5. Preferred Start Date (Date):</label>
            <input type="date" id="start_date" name="start_date">
        </div>

        <!-- Field 6: Dropdown Selection -->
        <div class="form-group">
            <label for="department">6. Department (Selection):</label>
            <select id="department" name="department">
                <option value="">-- Select a Department --</option>
                <option value="Business">Business</option>
                <option value="Arts and Science">Arts and Science</option>
                <option value="Economic Development">Economic Development</option>
                <option value="Health Sciences">Health Sciences</option>
            </select>
        </div>

        <!-- Field 7: Radio Button / Boolean Choice -->
        <div class="form-group radio-group">
            <label>7. Enrollment Status (Choice):</label>
            <label><input type="radio" name="enrollment" value="Full-Time"> Full-Time</label>
            <label><input type="radio" name="enrollment" value="Part-Time"> Part-Time</label>
        </div>

        <button type="submit">Submit Registration</button>
    </form>
</div>

</body>
</html>
